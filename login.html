<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <form id="login-form">

    <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required>

    <input id="username" type="text" placeholder="Enter your username" required>

    <button type="submit">
        Log In
    </button>

</form>

<p id="message"></p>

<script type="module" src="login.js"></script>
</body>
</html>
