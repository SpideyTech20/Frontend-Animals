<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Login</h1>

    <form id="login-form">
        <input
            type="email"
            id="email"
            placeholder="Email"
            autocomplete="email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required>

        <button type="submit">
            Log In
        </button>
    </form>

    <p id="message"></p>

    <p>Don't have an account? <a href="register.html">Register here</a></p>

    <script src="login.js"></script>
</body>
</html>
